name: oixproxy

services:
  oixproxy:
    image: ghcr.io/soffchen/oixproxy:latest
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ports:
      - "6172:6172/tcp"
      - "7200-7299:7200-7299/tcp"
    volumes:
      - ./config.json:/config/config.json:ro
      - oixproxy-data:/data
    command:
      - --map
      - --listen
      - 0.0.0.0:6172
      - --bind
      - 0.0.0.0
      - --config
      - /config/config.json

volumes:
  oixproxy-data:
