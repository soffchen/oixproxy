name: docker

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      extra_tag:
        description: Extra version tag to publish, e.g. v0.2.0
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Validate
        run: ./scripts/validate.sh

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: extra
        if: github.event_name == 'workflow_dispatch' && inputs.extra_tag != ''
        run: |
          extra="${{ inputs.extra_tag }}"
          extra="${extra#v}"
          echo "bare=$extra" >> "$GITHUB_OUTPUT"
          echo "v=v$extra" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=raw,value=${{ steps.extra.outputs.bare }},enable=${{ steps.extra.outputs.bare != '' }}
            type=raw,value=${{ steps.extra.outputs.v }},enable=${{ steps.extra.outputs.v != '' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          build-args: |
            VERSION=${{ github.event_name == 'workflow_dispatch' && inputs.extra_tag || (github.ref_type == 'tag' && github.ref_name || github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
